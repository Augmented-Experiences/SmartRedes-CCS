<!--
  PLANTILLA DE SPLASH (editar aqui; no index.html — lo genera configure.mjs)

  - Texto / marca: desktop/smartsuite.config.json (productName, splashSubtitle, accent)
  - Logo: splashLogo en smartsuite.config.json (ruta relativa a desktop/) o ../icon.png en la raiz del repo
  - Layout y estilos: bloque <style> y clases .brand / .splash-logo / .track abajo
  - Placeholders (solo en el HTML debajo): PRODUCT_NAME, BRAND_HTML, SPLASH_SUBTITLE, LOGO_HTML
-->
<!-- splash-kit: configure.mjs product=SmartRedes accent=#00D53A -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRedes</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="ccs-theme.css" />
  <link rel="stylesheet" href="accent.css" />
  <style>
    :root { --navy: var(--ccs-azul-oscuro); --accent: var(--ccs-accent); --brand-gradient: var(--ccs-gradient); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #002558;
      color: #fff; display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; text-align: center; gap: 20px; padding: 24px;
    }
    .splash-logo { width: auto; height: 88px; max-width: min(320px, 78vw); object-fit: contain; border-radius: 16px; background: #000; }
    .brand { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; }
    .brand .accent { color: var(--accent); }
    .sub { color: #c7d3ec; font-size: 14px; max-width: 460px; line-height: 1.5; }
    .track { width: 300px; max-width: 80vw; height: 8px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.15); position: relative; }
    .fill { height: 100%; width: 0%; border-radius: 8px; background: var(--brand-gradient); transition: width 0.4s ease; }
    .track.indeterminate .fill { width: 40% !important; position: absolute; left: -40%; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
    .status { color: #dbe6ff; font-size: 13px; min-height: 18px; max-width: 460px; }
    .pct { color: var(--accent); font-weight: 700; font-size: 13px; min-height: 16px; }
    .phase { color: #9fb2d6; font-size: 11px; min-height: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
    .enter {
      margin-top: 6px; padding: 9px 22px; border-radius: 10px; border: 0; cursor: pointer;
      background: var(--brand-gradient); color: #FFFFFF;
      font-weight: 700; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .enter.show { opacity: 1; pointer-events: auto; }
    .enter:hover { filter: brightness(1.05); }
    .foot { position: absolute; bottom: 18px; color: #9fb2d6; font-size: 11px; }
  </style>
</head>
<body>
  <img class="splash-logo" src="splash-logo.png" alt="SmartRedes" />
  
  <div class="brand">Smart<span class="accent">Redes</span></div>
  <div class="sub">Preparando tu asistente de marca y redes con IA local...</div>
  <div class="track indeterminate" id="track"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct"></div>
  <div class="status" id="status">Iniciando servicios...</div>
  <div class="phase" id="phase"></div>
  <button class="enter" id="enter">Entrar ahora</button>
  <div class="foot">Cámara de Comercio de Santiago</div>

  <script>
    const statusEl = document.getElementById('status');
    const pctEl = document.getElementById('pct');
    const fillEl = document.getElementById('fill');
    const trackEl = document.getElementById('track');
    const enterBtn = document.getElementById('enter');
    const phaseEl = document.getElementById('phase');

    const PHASE_LABELS = {
      'download-engine': 'Descargando Ollama',
      extract: 'Extrayendo Ollama',
      start: 'Iniciando Ollama',
      downloading: 'Descargando modelo',
      ollama: 'Preparando IA',
      ready: 'Listo',
      warning: 'Aviso'
    };

    let backendUrl = null;
    let navigated = false;
    let ollamaDone = false;
    let canContinue = false;
    let navigateTimer = null;

    function goToApp() {
      if (navigated || !backendUrl) return;
      navigated = true;
      window.location.replace(backendUrl);
    }

    function maybeNavigate() {
      if (navigated || !backendUrl) return;
      if (canContinue && ollamaDone) {
        if (!navigateTimer) {
          navigateTimer = setTimeout(goToApp, 600);
        }
      }
    }

    function render(s) {
      if (!s) return;
      if (s.message) statusEl.textContent = s.message;
      if (phaseEl) phaseEl.textContent = PHASE_LABELS[s.phase] || '';
      if (typeof s.percent === 'number' && s.percent >= 0) {
        trackEl.classList.remove('indeterminate');
        fillEl.style.width = s.percent + '%';
        pctEl.textContent = s.percent + '%';
      } else {
        trackEl.classList.add('indeterminate');
        pctEl.textContent = '';
      }
      if (s.backend_url) backendUrl = s.backend_url;
      if (s.can_continue) canContinue = true;
      if (s.ollama_done) {
        ollamaDone = true;
        enterBtn.classList.add('show');
      }
      maybeNavigate();
    }

    enterBtn.addEventListener('click', goToApp);

    function pollStatus() {
      const t = window.__TAURI__;
      if (!t || !t.core || navigated) return;
      t.core.invoke('current_status').then(render).catch(() => {});
    }

    function initTauri() {
      const t = window.__TAURI__;
      if (!t || !t.event || !t.core) { return false; }
      pollStatus();
      t.event.listen('status', (e) => render(e.payload));
      setInterval(pollStatus, 800);
      return true;
    }
    if (!initTauri()) {
      let tries = 0;
      const iv = setInterval(() => {
        if (initTauri() || ++tries > 50) clearInterval(iv);
      }, 100);
    }
  </script>
</body>
</html>
