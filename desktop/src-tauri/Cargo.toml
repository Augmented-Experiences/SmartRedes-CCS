[package]
name = "smartredes"
version = "1.0.0"
description = "SmartRedes — asistente de marca y redes con IA local para PYMEs, de la Cámara de Comercio de Santiago (CCS)."
authors = ["Cámara de Comercio de Santiago"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", default-features = false }

[lib]
name = "smartsuite_ollama"
path = "src/ollama_portable.rs"

[[bin]]
name = "smartredes"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
