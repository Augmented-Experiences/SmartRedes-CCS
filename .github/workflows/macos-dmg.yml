name: macOS DMG

on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Empaquetar SmartRedes
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            echo "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security list-keychains -d user -s build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain
            security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            rm -f "$RUNNER_TEMP/certificate.p12"
            if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
              export APPLE_SIGNING_IDENTITY
            fi
            if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "El .p12 no contiene un certificado Developer ID Application." >&2
              security find-identity -v -p codesigning build.keychain >&2 || true
              exit 1
            fi
            echo "Firmando como: $APPLE_SIGNING_IDENTITY"
          else
            echo "Sin certificado .p12: el disco queda sin firma de Apple."
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH || true
          fi
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ -n "${APPLE_API_KEY_BASE64:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            echo "$APPLE_API_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            unset APPLE_ID APPLE_PASSWORD || true
          elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH || true
          fi
          python -m venv venv
          bash desktop/scripts/build-backend.sh --installer
          DMG="$(echo desktop/src-tauri/target/release/bundle/dmg/*.dmg)"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          fi
          ls -lh desktop/src-tauri/target/release/bundle/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SmartRedes-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
